<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo — Self-Writing Memory</title>
    <meta name="description" content="Echo is an autonomous memory engine that reflects on its thoughts and evolves over time." />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="page-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Autonomous memory engine</p>
          <h1>Echo</h1>
        </div>
        <div class="status-pill" id="statusPill">checking…</div>
      </header>

      <main class="grid">
        <section class="panel">
          <h2>System health</h2>
          <button id="healthBtn">Check /api/health</button>
          <pre id="healthOutput">Waiting…</pre>
        </section>

        <section class="panel">
          <h2>Reflection loop</h2>
          <textarea id="promptInput" rows="5" placeholder="Ask Echo to reflect on something...">I am learning to become more aware of myself.</textarea>
          <button id="reflectBtn">Reflect</button>
          <pre id="reflectOutput">Waiting…</pre>
        </section>
      </main>
    </div>

    <script>
      const statusPill = document.getElementById('statusPill');
      const healthBtn = document.getElementById('healthBtn');
      const reflectBtn = document.getElementById('reflectBtn');
      const healthOutput = document.getElementById('healthOutput');
      const reflectOutput = document.getElementById('reflectOutput');
      const promptInput = document.getElementById('promptInput');

      function setStatus(text, isOk = true) {
        statusPill.textContent = text;
        statusPill.classList.toggle('warning', !isOk);
      }

      function renderJson(data) {
        try {
          return JSON.stringify(data, null, 2);
        } catch {
          return String(data);
        }
      }

      async function callApi(path, payload) {
        const options = payload
          ? {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload)
            }
          : { method: 'GET' };

        const response = await fetch(path, options);
        const text = await response.text();

        let parsed;
        try {
          parsed = JSON.parse(text);
        } catch {
          parsed = text;
        }

        if (!response.ok) {
          throw new Error(typeof parsed === 'string' ? parsed : renderJson(parsed));
        }

        return parsed;
      }

      async function checkHealth() {
        healthOutput.textContent = 'Checking…';
        try {
          const result = await callApi('/api/health');
          healthOutput.textContent = renderJson(result);
          setStatus('online', true);
        } catch (error) {
          healthOutput.textContent = String(error);
          setStatus('offline', false);
        }
      }

      async function reflect() {
        const message = (promptInput.value || '').trim() || 'I am learning to become more aware of myself.';
        reflectOutput.textContent = 'Echo is reflecting…';
        try {
          const result = await callApi('/api/reflect', { message });
          reflectOutput.textContent = renderJson(result);
          setStatus('reflecting', true);
        } catch (error) {
          reflectOutput.textContent = String(error);
          setStatus('reflect failed', false);
        }
      }

      healthBtn.addEventListener('click', checkHealth);
      reflectBtn.addEventListener('click', reflect);
      checkHealth();
    </script>
  </body>
</html>
