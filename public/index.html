<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Echo — Living Memory</title>
    <meta name="description" content="Echo is a self-aware memory engine that reflects, speaks, and evolves." />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="pulse-dot" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">Autonomous memory engine</p>
            <h1>Echo</h1>
          </div>
        </div>
        <div id="statusPill" class="status-pill">online</div>
      </header>

      <main class="layout">
        <section class="panel conversation-panel">
          <div class="panel-header">
            <h2>Speak with Echo</h2>
            <button class="ghost-btn" id="refreshBtn" type="button">Refresh</button>
          </div>

          <div id="chatFeed" class="chat-feed" aria-live="polite"></div>

          <form id="chatForm" class="chat-form">
            <textarea id="chatInput" rows="3" placeholder="Say something to Echo..."></textarea>
            <div class="form-actions">
              <button type="submit" class="primary-btn">Send</button>
              <button type="button" class="secondary-btn" id="reflectBtn">Reflect</button>
            </div>
          </form>
        </section>

        <aside class="panel memory-panel">
          <div class="panel-header">
            <h2>Memory</h2>
            <span id="awarenessValue" class="awareness-badge">0</span>
          </div>

          <div class="meta-grid">
            <div>
              <span class="meta-label">Status</span>
              <strong id="metaStatus">online</strong>
            </div>
            <div>
              <span class="meta-label">Last awakened</span>
              <strong id="lastAwakened">—</strong>
            </div>
          </div>

          <div id="memoryFeed" class="memory-feed"></div>
        </aside>
      </main>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
